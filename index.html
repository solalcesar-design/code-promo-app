<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PromoScan pour Maman</title>
    <style>
        :root { --apple-blue: #007aff; --apple-gray: #f5f5f7; --apple-text: #1d1d1f; --success-green: #34c759; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--apple-gray); color: var(--apple-text); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 90%; max-width: 450px; background: white; border-radius: 30px; padding: 40px 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.08); text-align: center; }
        h1 { font-size: 28px; font-weight: 700; margin-bottom: 10px; }
        .upload-box { background-color: #f0f7ff; border: 2px dashed var(--apple-blue); border-radius: 20px; padding: 50px 20px; margin-bottom: 25px; cursor: pointer; }
        .icon-circle { background: var(--apple-blue); color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; justify-content: center; align-items: center; margin: 0 auto 15px; font-size: 24px; }
        input[type="text"] { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #d2d2d7; font-size: 16px; margin-bottom: 20px; box-sizing: border-box; }
        .btn-main { background: var(--apple-blue); color: white; border: none; border-radius: 15px; padding: 18px; width: 100%; font-size: 18px; font-weight: 600; cursor: pointer; }
        #status-area { margin-top: 25px; display: none; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid var(--apple-blue); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .promo-success { color: var(--success-green); font-weight: bold; font-size: 20px; margin-top: 15px; padding: 15px; background: #f2faf3; border-radius: 12px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Coucou Maman ! ✨</h1>
    <p style="color: #86868b; margin-bottom: 30px;">Prends une photo de ton panier pour économiser.</p>

    <div class="upload-box" onclick="document.getElementById('fileInput').click()">
        <div class="icon-circle">📸</div>
        <div style="font-weight: 600; color: var(--apple-blue);">Clique pour mettre la photo</div>
        <input type="file" id="fileInput" hidden accept="image/*" onchange="showFileName()">
    </div>
    
    <div id="file-name" style="margin-bottom: 15px; font-size: 14px; color: var(--success-green);"></div>
    <input type="text" id="siteName" placeholder="C'est quel site ? (ex: Zara)">
    <button class="btn-main" onclick="simulerTest()">Trouver le moins cher 🚀</button>

    <div id="status-area">
        <div id="loading-view">
            <div class="loader"></div>
            <p id="loading-text">Analyse de l'image...</p>
        </div>
        <div id="result-view" style="display:none;"></div>
    </div>
</div>

<script>
    function showFileName() {
        const input = document.getElementById('fileInput');
        const nameDisplay = document.getElementById('file-name');
        if(input.files.length > 0) { nameDisplay.innerText = "✓ Photo ajoutée"; }
    }

    async function simulerTest() {
        const site = document.getElementById('siteName').value;
        const fileInput = document.getElementById('fileInput');

        if(!site || fileInput.files.length === 0) {
            alert("Maman, n'oublie pas la photo et le nom du site ! 😊");
            return;
        }

        document.getElementById('status-area').style.display = "block";
        document.getElementById('loading-view').style.display = "block";
        document.getElementById('result-view').style.display = "none";

        const formData = new FormData();
        formData.append('site', site);
        formData.append('file', fileInput.files[0]);

        try {
            // L'ADRESSE DE TON SERVEUR RENDER
            const response = await fetch('https://code-promo-app.onrender.com/test-promo', {
                method: 'POST',
                body: formData
            });
            const data = await response.json();

            document.getElementById('loading-view').style.display = "none";
            const resultView = document.getElementById('result-view');
            resultView.innerHTML = `<div class="promo-success">🎉 -${data.economie} d'économie !</div>
                                    <p>Le code <b>${data.code_gagnant}</b> a été appliqué.</p>`;
            resultView.style.display = "block";
        } catch (error) {
            alert("Le serveur fait dodo, attends 30 secondes et réessaye !");
            document.getElementById('status-area').style.display = "none";
        }
    }
</script>
</body>
</html>
